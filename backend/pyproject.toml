[project]
name = "backend"
version = "0.1.0"
description = "Production-grade URL shortener API"
readme = "README.md"
authors = [
    { name = "swsarancodes", email = "sarankumar.s@goml.io" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
